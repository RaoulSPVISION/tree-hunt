<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a1f">
<title>The Great Christmas Tree Hunt</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg1:#0d3326;--bg2:#06170f;--gold:#f4c95d;--red:#d23c4f;--green:#2f9e5b;--cream:#fff8ec;--ink:#1d2a24;--muted:#a9c3b6;--paper:#f1e8d8;--line:#e2d6c0;--brown:#6b5d4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#06170f}html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at top,#164a37 0%,var(--bg1) 40%,var(--bg2) 100%) fixed;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.lights{position:fixed;top:0;left:0;right:0;height:26px;display:flex;justify-content:space-around;z-index:5;pointer-events:none}
.lights::before{content:"";position:absolute;top:7px;left:0;right:0;height:2px;background:#0a1a12}
.bulb{width:10px;height:15px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;margin-top:8px;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 10px currentColor}50%{opacity:.35;box-shadow:none}}
main{position:relative;z-index:1;padding:36px 16px 100px;max-width:560px;margin:0 auto}
h1,h2,h3,.title{font-family:Georgia,"Times New Roman",serif}
h3{margin:0 0 8px;color:var(--gold)}
.title{font-size:34px;line-height:1.1;text-align:center;color:var(--gold);text-shadow:0 2px 0 #7a4b00,0 0 18px rgba(244,201,93,.4);margin:10px 0}
.title.small{font-size:25px}
.center{text-align:center}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:700;background:var(--gold);color:#3b2400;margin:10px 0;box-shadow:0 4px 0 #a5781a;font-family:inherit;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a5781a}
.btn:disabled{opacity:.4}
.btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 #8a1f2e}
.btn.green{background:var(--green);color:#fff;box-shadow:0 4px 0 #1b6339}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.2)}
.btn.small{padding:10px 14px;font-size:15px;width:auto;display:inline-block}
.btn.big{font-size:22px;padding:22px}
.redtext{color:#ff9aa8!important}
.row{display:flex;gap:10px}.row>*{flex:1}
input{width:100%;padding:14px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff;font-size:17px;font-family:inherit}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.av{font-size:28px;padding:6px 0;text-align:center;border-radius:12px;background:rgba(255,255,255,.08);border:2px solid transparent;cursor:pointer}
.av.sel{border-color:var(--gold);background:rgba(244,201,93,.25)}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;color:#fff;padding:10px;border-radius:10px;font-size:16px;font-family:inherit}
.seg button.on{background:var(--gold);color:#3b2400;font-weight:700}
.member{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:rgba(255,255,255,.06);margin:8px 0}
.member .emo{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.member .nm{flex:1;font-weight:700;font-size:18px}
.tag{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--muted)}
.x{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;width:40px;height:40px;font-size:16px}
.hero-tree{font-size:110px;text-align:center;animation:glow 2.5s infinite;margin-top:16px}
@keyframes glow{50%{filter:drop-shadow(0 0 24px #f4c95d)}}
.envelope{display:block;margin:18px auto 0;font-size:96px;background:none;border:0;animation:bob 1.6s ease-in-out infinite;cursor:pointer}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.lead{font-size:18px;text-align:center;color:#e8f3ec;line-height:1.4}
.hint{text-align:center;color:var(--muted)}
.step{text-align:center;color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-size:12px;margin-top:8px}
.scroll{background:var(--cream);color:#3a2a14;font-family:Georgia,serif;font-size:19px;line-height:1.55;padding:20px;border-radius:12px;box-shadow:0 0 0 6px rgba(244,201,93,.35);margin:14px 0;text-align:center}
.signgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin:12px 0}
.sign{background:var(--c);border:0;border-radius:18px;padding:14px 6px;color:#fff;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.sign .e{font-size:40px}
.sign.done{outline:3px solid var(--gold)}
.chip-center{text-align:center;margin:6px 0}
.chip-center span{display:inline-block;background:rgba(244,201,93,.15);border:1px solid rgba(244,201,93,.4);color:var(--gold);padding:6px 12px;border-radius:99px;font-size:14px;margin:3px}
.label{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:1.5px}
.sub{color:var(--muted);font-size:14px}
.bigcount{font-size:84px;font-weight:800;font-family:Georgia,serif;color:var(--gold);line-height:1;text-shadow:0 0 24px rgba(244,201,93,.45)}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.badges span{background:rgba(244,201,93,.15);border:1px solid rgba(244,201,93,.4);border-radius:99px;padding:6px 10px;font-size:13px}
.treebox svg{width:100%;max-width:240px;display:block;margin:0 auto}
/* session */
.sesstop{display:flex;align-items:center;gap:10px}
.sesslabel{flex:1;text-align:center;font-weight:700}
#timer{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400;font-size:14px}
.iconbtn{width:46px;height:46px;border-radius:14px;border:0;background:rgba(255,255,255,.1);font-size:22px}
.counter{text-align:center;margin-top:8px}
.nextgift{margin:10px 0 4px;font-size:15px;text-align:center}
.progress{height:12px;background:rgba(0,0,0,.3);border-radius:99px;overflow:hidden;margin-top:6px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .3s}
.spotgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.spotgrid.one{grid-template-columns:1fr}.spotgrid.one .spot{min-height:220px}
.spotgrid.odd .spot:last-child{grid-column:span 2}
.spot{border:0;border-radius:22px;padding:18px 8px;color:#fff;font-family:inherit;min-height:140px;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.spot:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.spot .e{font-size:48px}.spot .n{font-size:19px;font-weight:700;margin-top:4px}
.spot .t{font-size:12px;opacity:.85;margin-top:4px}
.spot .c{position:absolute;top:8px;right:10px;font-size:18px;font-weight:800;background:rgba(0,0,0,.25);border-radius:99px;padding:2px 10px}
.spot.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.07)}}
.plus{position:fixed;pointer-events:none;font-size:28px;font-weight:800;color:var(--gold);z-index:50;animation:rise .9s forwards;text-shadow:0 2px 6px rgba(0,0,0,.5)}
@keyframes rise{to{transform:translateY(-90px);opacity:0}}
.giftchip{position:fixed;right:16px;bottom:24px;width:76px;height:76px;border-radius:50%;background:var(--red);font-size:38px;border:3px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.4);animation:wiggle 1.2s infinite;z-index:30}
.giftchip b{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#3b2400;border-radius:99px;font-size:14px;padding:2px 8px}
/* overlay */
.overlay{position:fixed;inset:0;background:rgba(3,12,8,.82);z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}
.overlay.hidden{display:none}
.sheet{background:var(--cream);color:var(--ink);border-radius:26px;padding:22px;width:100%;max-width:480px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:in .25s}
@keyframes in{from{transform:scale(.9);opacity:0}}
.sheet.challenge{border-top:8px solid var(--red)}
.sheet h2{font-family:Georgia,serif;color:var(--ink);margin:4px 0 10px}
.sheet label{color:var(--brown)}
.sheet input{background:#fff;color:var(--ink);border-color:var(--line)}
.sheet .btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line)}
.sheet .av,.sheet .seg{background:var(--paper)}
.sheet .seg button{color:var(--ink)}
.sheet .sub{color:var(--brown)}
.letter{font-family:Georgia,serif;font-size:17px;line-height:1.5;color:#3a2a14}
.letter p{margin:0 0 10px}
.letter .sig{text-align:right;font-style:italic;font-size:20px}
.letter-head{text-align:center;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:8px 12px;font-size:14px;font-family:inherit}
.whogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;margin:8px 0}
.who{background:var(--paper);border:3px solid transparent;border-radius:16px;padding:10px 4px;font-size:32px;font-family:inherit;color:var(--ink)}
.who small{font-size:13px;font-weight:600}
.who.on{border-color:var(--green);background:#dff3e6}
.safety{background:#fff1d6;border-left:4px solid var(--gold);padding:10px;border-radius:8px;font-size:14px;margin:12px 0;color:#5a4210}
.ctype{display:inline-block;color:#fff;padding:6px 12px;border-radius:99px;font-weight:700;font-size:14px;margin-bottom:10px}
.ctype.sm{font-size:12px;padding:4px 10px;margin-bottom:6px}
.q{font-family:Georgia,serif;font-size:23px;line-height:1.3;margin:6px 0 14px;color:var(--ink)}
.lvl{font-size:13px;color:var(--brown);font-weight:600}
.opt{display:block;width:100%;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:#fff;margin:8px 0;font-size:17px;font-family:inherit;color:var(--ink)}
.opt.right{background:#dff3e6;border-color:var(--green);font-weight:700}
.opt.wrong{background:#fde2e5;border-color:var(--red)}
.fact{background:#fff1d6;border-radius:12px;padding:12px;margin:10px 0;color:#5a4210;font-size:16px;line-height:1.4}
.linkbtn{background:none;border:0;color:var(--brown);text-decoration:underline;font-size:15px;padding:10px;font-family:inherit}
.gtitle{font-family:Georgia,serif;font-size:24px;color:var(--red);font-weight:700}
.gift{font-size:140px;line-height:1.2;animation:wiggle .9s ease-in-out infinite;background:none;border:0;display:block;margin:10px auto;cursor:pointer}
.gift.open{animation:burst .45s forwards}
@keyframes wiggle{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-9deg) scale(1.04)}75%{transform:rotate(9deg) scale(1.04)}}
@keyframes burst{to{transform:scale(2.2) rotate(20deg);opacity:0}}
.mnum{font-size:96px;font-weight:800;font-family:Georgia,serif;color:var(--red);line-height:1}
.badgepill{display:inline-block;background:var(--gold);color:#3b2400;border-radius:99px;padding:8px 14px;font-weight:700;margin:8px 0}
.ornbig{width:110px;height:110px;border-radius:50%;margin:24px auto 10px;background:radial-gradient(circle at 32% 30%,#fff 0 8%,var(--oc) 32%,color-mix(in srgb,var(--oc) 55%,#000) 100%);box-shadow:0 10px 30px rgba(0,0,0,.25);position:relative;animation:swing 2s ease-in-out infinite;transform-origin:50% -30px}
.ornbig::before{content:"";position:absolute;top:-14px;left:50%;width:26px;height:16px;margin-left:-13px;background:#c9a227;border-radius:4px 4px 2px 2px}
@keyframes swing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.ornname{font-weight:700;font-size:20px}
.santa{font-style:italic;font-family:Georgia,serif;font-size:17px;color:#5a4210}
/* history & family */
.tabs{display:flex;gap:8px;overflow-x:auto;margin:8px 0}
.tabs button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:99px;padding:8px 16px;font-size:15px;font-family:inherit}
.tabs button.on{background:var(--gold);color:#3b2400;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px}
.stat .k{font-size:12px;color:var(--muted)}.stat .val{font-size:17px;font-weight:700;margin-top:2px}
.note{font-size:14px;color:#d9e8df;background:rgba(244,201,93,.1);border-radius:12px;padding:10px 12px;line-height:1.4}
.chart{display:flex;align-items:stretch;gap:3px;height:170px;overflow-x:auto;padding-bottom:4px}
.col{flex:1 0 14px;display:flex;flex-direction:column;align-items:center}
.col .v{font-size:9px;color:var(--muted);height:12px}
.col .bw{flex:1;width:100%;display:flex;align-items:flex-end}
.col .bar{width:100%;background:linear-gradient(var(--gold),var(--red));border-radius:4px 4px 0 0;min-height:2px}
.col.tg .bar{background:#f6ad55}.col.xm .bar{background:#48bb78}
.col .dl{font-size:9px;color:var(--muted);height:14px;white-space:nowrap}
.legend{font-size:12px;color:var(--muted);margin:6px 0 0}
.hunt{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.hunt small{color:var(--muted)}.hn{text-align:right;font-weight:700;white-space:nowrap}
table.cmp{width:100%;border-collapse:collapse;font-size:14px}
table.cmp th,table.cmp td{padding:8px 4px;text-align:left;border-bottom:1px solid rgba(255,255,255,.1)}
table.cmp th{color:var(--muted);font-weight:600}
.award{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:rgba(244,201,93,.08);margin:8px 0}
.award .ai{font-size:30px}.award .at{flex:1}.award .at small{color:var(--muted);display:block}
.lb{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.lb .rk{width:28px;font-size:20px;text-align:center}.lb .nm{flex:1;font-weight:700}.lb .sc{text-align:right;font-size:15px}
.trow{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.tog{width:54px;height:32px;border-radius:99px;border:0;background:rgba(255,255,255,.2);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--green)}.tog.on::after{left:25px}
.savedrow{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:16px;padding:12px;margin:8px 0;font-size:15px;font-family:inherit}
.foot{text-align:center;color:var(--muted);font-size:12px}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(5,20,13,.94);border-top:1px solid rgba(255,255,255,.1);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;background:none;border:0;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;font-family:inherit}
.nav button span{font-size:22px}.nav button.on{color:var(--gold)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--cream);color:var(--ink);padding:12px 18px;border-radius:99px;font-weight:600;opacity:0;transition:.25s;z-index:70;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translateX(-50%)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#confetti i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div class="lights" id="lights"></div>
<main id="app"></main>
<nav id="nav"></nav>
<div id="overlay" class="overlay hidden"></div>
<div id="confetti"></div>
<div id="toast"></div>
<script>
'use strict';
/* ============ CONTENT (append new items at the END of each list so saved IDs stay valid) ============ */
const AVATARS=['🎅','🤶','🧝','🧝‍♀️','🦌','⛄','🐧','🐻‍❄️','👼','🍪','⭐','🔔','🎁','🍭','❄️','🧸','🦉','🐿️'];
const COLORS=['#d23c4f','#2f9e5b','#2b6cb0','#b7791f','#805ad5','#d0568b','#2c7a7b','#c05621'];
const ORN=[['#e53e3e','Red Bauble'],['#f6c343','Gold Star'],['#cbd5e0','Silver Bell'],['#63b3ed','Blue Snowflake'],['#48bb78','Green Glass Ball'],['#9f7aea','Purple Plum'],['#fc8181','Candy Cane Swirl'],['#f687b3','Pink Sugarplum'],['#f6ad55','Orange Glow'],['#4fd1c5','Teal Twinkle'],['#c53030','Cranberry'],['#f7fafc','Frosted Snowball'],['#3182ce','Royal Blue'],['#2f855a','Emerald'],['#c05621','Copper Shine'],['#b794f4','Lilac Dream'],['#9b2c2c','Ruby'],['#d69e2e','Golden Pinecone'],['#bee3f8','Ice Crystal'],['#e53e3e','Holly Berry'],['#2c5282','Midnight Sky'],['#9ae6b4','Peppermint'],['#feb2b2','Rose Gold'],['#fefcbf','Starlight']].map(([c,n])=>({c,n}));
const SLOTS=[[100,48],[86,74],[116,78],[78,98],[124,98],[70,120],[100,112],[130,122],[56,140],[88,138],[118,142],[146,136],[74,158],[126,160],[100,168],[44,190],[70,176],[132,176],[160,188],[58,200],[86,196],[114,198],[142,200],[100,190]];
const TYPES={
 trivia:{name:'Christmas Trivia',icon:'🧠',color:'#2b6cb0',w:30},
 challenge:{name:'Quick Challenge',icon:'⏱️',color:'#d23c4f',w:15},
 charades:{name:'Seat Charades',icon:'🎭',color:'#805ad5',w:12},
 riddle:{name:'Holiday Riddle',icon:'🤔',color:'#b7791f',w:12},
 wyr:{name:'Would You Rather?',icon:'🤷',color:'#d0568b',w:11},
 sing:{name:'Finish the Carol',icon:'🎶',color:'#2f9e5b',w:10},
 family:{name:'Family Question',icon:'💬',color:'#2c7a7b',w:10}
};
const TRIVIA=[
['kid','Where does Santa live?',['The South Pole','The North Pole','The Moon'],1,'Santa’s workshop is said to be at the North Pole.'],
['kid','What do people often leave out for Santa on Christmas Eve?',['Milk and cookies','Pizza','Ice cream'],0,'In the UK and Ireland, Santa often gets a mince pie instead!'],
['kid','What do you hang by the fireplace for Santa to fill?',['Mittens','Stockings','Hats'],1],
['kid','What color are the stripes on a classic candy cane?',['Red and white','Blue and green','Yellow and purple'],0],
['kid','What do we call Santa’s helpers who make the toys?',['Gnomes','Elves','Fairies'],1],
['kid','Which animals pull Santa’s sleigh?',['Horses','Reindeer','Polar bears'],1],
['kid','What date is Christmas Eve?',['December 24','December 25','December 31'],0],
['kid','In Australia, what season is it at Christmas?',['Winter','Summer','Autumn'],1,'Australia is in the Southern Hemisphere, so Christmas comes in summer — beach time!'],
['kid','What plant do people stand under to share a Christmas kiss?',['Mistletoe','Holly','Ivy'],0],
['kid','How many arms does a snowflake usually have?',['Four','Six','Eight'],1,'Water freezes into six-sided crystals, so snowflakes have six arms.'],
['kid','What spice gives gingerbread its flavor?',['Ginger','Chocolate','Strawberry'],0],
['kid','What does “Joyeux Noël” mean?',['Happy New Year','Merry Christmas','Good night'],1,'It’s French for Merry Christmas.'],

let ac=null;
function unlockAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,t0,d,type='sine',v=.18){if(!ac||!S.settings.sound)return;try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}

function jingle(){unlockAudio();const E=659,G=784,C=523,D=587;let t=0;[[E,.16],[E,.16],[E,.32],[E,.16],[E,.16],[E,.32],[E,.16],[G,.16],[C,.24],[D,.08],[E,.5]].forEach(([f,d])=>{tone(f,t,d*1.6,'triangle',.15);tone(f*2,t,d,'sine',.04);t+=d+.04})}
function beep(){unlockAudio();tone(880,0,.2,'square',.07);tone(880,.3,.2,'square',.07);tone(1320,.6,.5,'square',.07)}

 return out.map(c=>`<span>${c}</span>`).join('')}

/* ============ HUNT SESSION ============ */
let huntWho=new Set(),lastTap={};

function drawHuntPrompt(lbl){showOverlay(`<h2>🎄 New Tree Hunt</h2><label>Where are we hunting?</label><input id="huntLabel" placeholder="e.g. Drive to Grandma’s" value="${esc(lbl)}" maxlength="40">

 const s={id:uid(),label,start:Date.now(),end:null,who:[...huntWho],gifts:0,pending:0,done:0,skipped:0,device:S.deviceId};S.sessions.push(s);S.activeSession=s.id;save();

 const rate=dur>=60000?(ev.length/(dur/36e5)).toFixed(1):'—',record=ev.length>0&&ev.length>best&&S.sessions.filter(x=>seasonOf(x.start)===y).length>1;

let cur=null,timerH=null;
function pickChallenge(){const types=Object.keys(TYPES),tot=types.reduce((a,t)=>a+TYPES[t].w,0);let r=Math.random()*tot,type=types[0];for(const t of types){if((r-=TYPES[t].w)<0){type=t;break}}

function spoken(c){switch(c.type){case'trivia':return `${c.q} Is it: ${c.o.map((o,i)=>'ABC'[i]+', '+o).join('. ')}?`;case'charades':return 'Seat charades! '+c.q+'. No words allowed!';case'sing':return 'Finish the carol! '+c.q;case'riddle':return 'Riddle time! '+c.q;case'family':return 'Family question! '+c.q;case'challenge':return 'Quick challenge! '+c.q;default:return c.q}}

 else if(c.type==='challenge'){body=`<div class="q">${esc(c.q)}</div>${c.t?`<button class="btn red small" id="ctimer" onclick="startTimer()">⏱️ Start ${c.t}-second timer</button> `:''}${c.a?(cur.rev?`<div class="fact">💡 ${esc(c.a)}</div>`:`<button class="btn ghost small" onclick="reveal()">👀 Answer</button>`):''}`}
 else if(c.type==='charades'){body=`<div class="q">${esc(c.q)}</div><p class="sub">No words — act it out from your seat while everyone else guesses! (Driver: guessing only 😉)</p>`}

 showOverlay(`<div class="ctype" style="background:${T.color}">${T.icon} ${T.name}</div>${body}
 <button class="btn green" onclick="doneChallenge()">✅ We did it!</button>
 <div class="row"><button class="btn ghost" onclick="laterChallenge()">🔖 Later</button><button class="btn ghost" onclick="skipChallenge()">⏭️ Skip</button></div>

/* ============ HISTORY ============ */
let histSeason=null;
function seasonsList(){const set=new Set([curSeason()]);S.events.forEach(e=>set.add(seasonOf(e.ts)));S.sessions.forEach(s=>set.add(seasonOf(s.start)));return[...set].sort((a,b)=>b-a)}
function seasonStats(y){const ev=eventsOf(y).sort((a,b)=>a.ts-b.ts),ss=S.sessions.filter(s=>seasonOf(s.start)===y);
 const hrs=ss.reduce((a,s)=>a+((s.end||Date.now())-s.start),0)/36e5,inHunt=ev.filter(e=>e.s).length,days={},weeks={};
 ev.forEach(e=>{const k=dayKey(e.ts);days[k]=(days[k]||0)+1;const d=new Date(e.ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));weeks[d.getTime()]=(weeks[d.getTime()]||0)+1});
 let best=null,pw=null;for(const k in days)if(!best||days[k]>best[1])best=[k,days[k]];for(const k in weeks)if(!pw||weeks[k]>pw[1])pw=[+k,weeks[k]];
 const tg=thanksgiving(y).getTime(),before=ev.filter(e=>e.ts<tg).length;
 return{y,ev,ss,hrs,rate:hrs>=1/60?inHunt/hrs:null,days,best,pw,tg,before,after:ev.length-before,first:ev[0]}}
function dailyChart(st){if(!st.ev.length)return '<p class="sub">No trees yet this season — the chart fills in as you hunt.</p>';
 const start=new Date(st.ev[0].ts);start.setHours(0,0,0,0);const end=st.y===curSeason()?new Date():new Date(st.ev[st.ev.length-1].ts);end.setHours(0,0,0,0);
 const days=[];for(const d=new Date(start);d<=end&&days.length<120;d.setDate(d.getDate()+1))days.push(new Date(d));
 const max=Math.max(1,...days.map(d=>st.days[dayKey(d)]||0)),tgk=dayKey(st.tg),xk=dayKey(new Date(st.y,11,25));
 return `<div class="chart">${days.map((d,i)=>{const k=dayKey(d),v=st.days[k]||0,mk=k===tgk?'tg':k===xk?'xm':'';return `<div class="col ${mk}"><div class="v">${v||''}</div><div class="bw"><div class="bar" style="height:${v/max*100}%"></div></div><div class="dl">${mk==='tg'?'🦃':mk==='xm'?'🎄':(i%7===0?(d.getMonth()+1)+'/'+d.getDate():'')}</div></div>`}).join('')}</div><p class="legend">🦃 Thanksgiving · 🎄 Christmas Day</p>`}
function stat(i,k,v){return `<div class="stat"><div class="k">${i} ${k}</div><div class="val">${v}</div></div>`}
function renderHistory(){const list=seasonsList();if(!histSeason||!list.includes(histSeason))histSeason=list[0];const st=seasonStats(histSeason),fm=st.first&&member(st.first.m);
 const hunts=[...st.ss].sort((a,b)=>b.start-a.start).map(s=>{const n=sessionEvents(s).length,dur=(s.end||Date.now())-s.start;return `<div class="hunt"><div><b>${esc(s.label)}</b><br><small>${fmtDate(s.start)} · ${fmtDur(dur)}${s.end?'':' · in progress'}</small></div><div class="hn">${n} 🎄<br><small>${dur>=60000?(n/(dur/36e5)).toFixed(1):'—'}/hr · ${s.done||0} ⭐</small></div></div>`}).join('');
 const cmp=list.length>1?`<div class="card"><h3>Year vs. year</h3><table class="cmp"><tr><th>Season</th><th>Trees</th><th>First tree</th><th>Trees/hr</th></tr>${list.map(y=>{const s=seasonStats(y);return `<tr><td>${y}</td><td>${s.ev.length}</td><td>${s.first?fmtDate(s.first.ts):'—'}</td><td>${s.rate?s.rate.toFixed(1):'—'}</td></tr>`}).join('')}</table></div>`:'';
 app.innerHTML=`<div class="title small">📜 Hunt History</div><div class="tabs">${list.map(y=>`<button class="${y===histSeason?'on':''}" onclick="histSeason=${y};renderHistory()">${y} season</button>`).join('')}</div>
 <div class="stats">${stat('🎄','Total trees',st.ev.length)}${stat('🌟','First tree',st.first?fmtDate(st.first.ts)+(fm?' · '+esc(fm.name):''):'—')}${stat('🚗','Hunts',st.ss.length)}${stat('⏱️','Time hunting',st.ss.length?fmtHrs(st.hrs):'—')}${stat('📈','Trees per hour',st.rate?st.rate.toFixed(1):'—')}${stat('🏆','Best day',st.best?fmtDate(keyDate(st.best[0]))+' · '+st.best[1]:'—')}${stat('📅','Peak week',st.pw?'Wk of '+fmtDate(st.pw[0])+' · '+st.pw[1]:'—')}${stat('🦃','Before / after Thanksgiving',st.before+' / '+st.after)}</div>
 <p class="note">💡 <b>Trees per hour</b> is the fair number to compare between years — it adjusts for how much you drove.</p>
 <div class="card"><h3>Trees per day</h3>${dailyChart(st)}</div>${cmp}
 <div class="card"><h3>Hunts</h3>${hunts||'<p class="sub">No hunts yet this season.</p>'}</div>`}

function renderFamily(){const y=curSeason(),ev=eventsOf(y),log=S.log.filter(l=>l.result==='done'&&seasonOf(l.ts)===y),today=dayKey(Date.now());
 const ms=S.family.members.filter(m=>!m.archived||ev.some(e=>e.m===m.id));
 const trees=id=>ev.filter(e=>e.m===id).length,stars=id=>log.filter(l=>(l.stars||[]).includes(id)).length,
  trivia=id=>log.filter(l=>l.type==='trivia'&&l.stars&&l.stars.length===1&&l.stars[0]===id).length,
  td=id=>ev.filter(e=>e.m===id&&dayKey(e.ts)===today).length,
  hunts=id=>S.sessions.filter(s=>seasonOf(s.start)===y&&S.events.some(e=>e.s===s.id&&e.m===id)).length,
  oneHunt=id=>Math.max(0,...S.sessions.filter(s=>seasonOf(s.start)===y).map(s=>sessionEvents(s).filter(e=>e.m===id).length));
 const top=f=>{let b=null,bv=0;ms.forEach(m=>{const v=f(m.id);if(v>bv){b=m;bv=v}});return b?{m:b,v:bv}:null};
 const awards=[['🌟','Spotter of the Day',top(td),'trees today'],['🏆','Season Champion',top(trees),'trees this season'],['🚗','Most Trees in One Hunt',top(oneHunt),'trees in a single hunt'],['🧠','Trivia Champion',top(trivia),'trivia wins'],['🔥','Most Active Hunter',top(hunts),'hunts'],['⭐','Star Collector',top(stars),'stars']];
 const ranked=[...ms].sort((a,b)=>trees(b.id)-trees(a.id)||stars(b.id)-stars(a.id));
 app.innerHTML=`<div class="title small">👪 ${famTitle()} Leaderboard</div>
 <div class="card"><h3>${y} season</h3>${ranked.map((m,i)=>`<div class="lb"><span class="rk">${['🥇','🥈','🥉'][i]||i+1}</span><span class="emo" style="font-size:28px">${m.avatar}</span><span class="nm">${esc(m.name)}</span><span class="sc">${trees(m.id)} 🎄<br>${stars(m.id)} ⭐</span></div>`).join('')||'<p class="sub">Add hunters in Settings.</p>'}</div>
 <div class="card"><h3>Family awards</h3>${awards.map(([i,n,t,u])=>`<div class="award"><span class="ai">${i}</span><span class="at"><b>${n}</b><small>${t?`${t.m.avatar} ${esc(t.m.name)} · ${t.v} ${u}`:'Up for grabs!'}</small></span></div>`).join('')}</div>
 <p class="note">All in good fun — every tree counts toward the family total! 🎄</p>`}

/* ============ SETTINGS & DATA ============ */
let ed=null;
function renderSettings(){const tg=(k,l)=>`<div class="trow"><span>${l}</span><button class="tog ${S.settings[k]?'on':''}" onclick="S.settings.${k}=!S.settings.${k};save();renderSettings()" aria-label="${l}"></button></div>`;
 app.innerHTML=`<div class="title small">⚙️ Settings</div>
 <div class="card"><label style="margin-top:0">Family name</label><input value="${esc(S.family.name)}" oninput="S.family.name=this.value;save()" maxlength="30"></div>
 <div class="card"><h3>Hunt team</h3>${activeMembers().map(m=>memberRow(m,`<button class="x" onclick="editMember('${m.id}')" aria-label="Edit">✏️</button>`)).join('')}<button class="btn green" onclick="editMember(null)">➕ Add a hunter</button></div>
 <div class="card"><h3>Sound &amp; voice</h3>${tg('sound','🔔 Sound effects')}${tg('voice','🗣️ Read challenges out loud')}</div>
 <div class="card"><h3>Your data</h3><p class="sub">Everything saves on this phone automatically. Save a backup now and then — and always before switching phones.</p>
  <button class="btn ghost" onclick="exportJSON()">💾 Save a backup file</button><button class="btn ghost" onclick="exportCSV()">📊 Export trees to a spreadsheet (CSV)</button><button class="btn ghost" onclick="$('#imp').click()">📥 Restore or merge a backup</button><input type="file" id="imp" accept=".json,application/json" hidden onchange="importJSON(this)"></div>
 <div class="card"><button class="btn ghost" onclick="go('intro')">✉️ Replay Santa’s letter</button><button class="btn ghost redtext" onclick="resetAll()">🗑️ Erase everything</button></div>
 <p class="foot">The Great Christmas Tree Hunt · Phase 1 · v1.0</p>`}
function editMember(id){const m=id&&member(id);ed=m?{id,name:m.name,avatar:m.avatar,kind:m.kind}:{id:null,name:'',avatar:'⛄',kind:'kid'};drawEdit()}
function setEdAv(a){ed.avatar=a;drawEdit()}
function drawEdit(){showOverlay(`<h2>${ed.id?'Edit hunter':'New hunter'}</h2><label>Name or nickname</label><input value="${esc(ed.name)}" oninput="ed.name=this.value" maxlength="20"><label>Avatar</label>${avatarPicker(ed.avatar,'setEdAv')}<label>Trivia level</label><div class="seg"><button class="${ed.kind==='kid'?'on':''}" onclick="ed.kind='kid';drawEdit()">🧒 Kid</button><button class="${ed.kind==='adult'?'on':''}" onclick="ed.kind='adult';drawEdit()">🧑 Grown-up</button></div>
 <button class="btn green" onclick="saveEdit()">Save</button>${ed.id?'<button class="btn ghost redtext" onclick="archiveMember()">Remove from the team</button>':''}<button class="btn ghost" onclick="closeOverlay()">Cancel</button>`)}
function saveEdit(){const n=ed.name.trim();if(!n){toast('A name is needed');return}if(ed.id)Object.assign(member(ed.id),{name:n,avatar:ed.avatar,kind:ed.kind});else newMember(n,ed.avatar,ed.kind);save();closeOverlay();render()}
function archiveMember(){const m=member(ed.id);if(!confirm(`Remove ${m.name} from the team? Their past trees stay in your history.`))return;m.archived=true;save();closeOverlay();render()}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function exportJSON(){download(`tree-hunt-backup-${dayKey(Date.now())}.json`,JSON.stringify(S),'application/json');toast('Backup saved 💾')}
function exportCSV(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[['Date','Time','Season','Spotter','Hunt']];
 [...S.events].sort((a,b)=>a.ts-b.ts).forEach(e=>{const s=S.sessions.find(x=>x.id===e.s),m=member(e.m);rows.push([dayKey(e.ts),new Date(e.ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}),seasonOf(e.ts),m?m.name:'',s?s.label:''])});
 download(`tree-hunt-trees-${dayKey(Date.now())}.csv`,rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');toast('Spreadsheet exported 📊')}
function mergeInto(o){const u=(a,b,k=x=>x.id)=>{const seen=new Set(a.map(k));(b||[]).forEach(x=>{if(!seen.has(k(x))){a.push(x);seen.add(k(x))}})};
 u(S.events,o.events);u(S.sessions,(o.sessions||[]).filter(s=>s.end));u(S.log,o.log);u(S.family.members,o.family&&o.family.members);u(S.badges,o.badges,b=>b.id+'|'+(b.m||'')+'|'+(b.season||''));u(S.saved,o.saved,x=>x.cid);
 if(!S.family.name&&o.family&&o.family.name)S.family.name=o.family.name;if(o.onboarded)S.onboarded=true}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.events))throw 0;const before=S.events.length;mergeInto(o);save();toast(`Merged! ${S.events.length-before} new trees added.`);render()}catch(e){toast('That file isn’t a Tree Hunt backup')}inp.value=''};r.readAsText(f)}
function resetAll(){if(!confirm('Erase ALL trees, hunts and family info on this phone? This cannot be undone.'))return;if(!confirm('Last chance — did you save a backup? Erase everything?'))return;localStorage.removeItem(KEY);S=blank();save();signed=new Set();draft={name:'',avatar:'🎅',kind:'kid'};go('intro')}

/* ============ AMBIENCE & START ============ */
(function(){const lc=['#ff5a6e','#ffd66b','#6be3a0','#6bb8ff','#ff9f5a'];$('#lights').innerHTML=Array.from({length:16},(_,i)=>`<span class="bulb" style="color:${lc[i%5]};background:${lc[i%5]};animation-delay:${(i%4)*.5}s"></span>`).join('')})();
(function(){const c=$('#snow'),x=c.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1),rm=matchMedia('(prefers-reduced-motion: reduce)').matches;let W,H;const fl=Array.from({length:60},()=>({x:Math.random(),y:Math.random(),r:Math.random()*2.2+.8,s:Math.random()*.0015+.0006,w:Math.random()*6}));
 function rs(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px'}rs();addEventListener('resize',rs);
 function f(t){x.clearRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.85)';for(const p of fl){p.y+=p.s;if(p.y>1.02){p.y=-.02;p.x=Math.random()}x.beginPath();x.arc((p.x+Math.sin(t/1500+p.w)*.01)*W,p.y*H,p.r*dpr,0,7);x.fill()}if(!rm&&!document.hidden)requestAnimationFrame(f);else setTimeout(()=>requestAnimationFrame(f),500)}requestAnimationFrame(f)})();
setInterval(()=>{if(view==='session'){const el=$('#timer'),s=activeSession();if(el&&s)el.textContent=fmtDur(Date.now()-s.start)}},1000);
document.addEventListener('pointerdown',unlockAudio,{once:true});
try{'speechSynthesis' in window&&speechSynthesis.getVoices()}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();if(activeSession())wake();
</script>
</body>
